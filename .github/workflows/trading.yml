name: Robot de trading

on:
  schedule:
    # Chaque jour de semaine à 15 h 35 UTC
    # (= 10 h 35 à Montréal en hiver, 11 h 35 en été ; le marché ouvre à 9 h 30)
    - cron: "35 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyse seulement (rien n'est acheté, vendu ni enregistré)"
        type: boolean
        default: false

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # pour enregistrer le journal, le portefeuille et la page dans le dépôt
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le robot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python bot.py --dry-run
          else
            python bot.py
          fi

      - name: Enregistrer les résultats
        if: always()
        run: |
          FILES="journal.csv portfolio.json README.md rapport docs"
          if [ -n "$(git status --porcelain $FILES 2>/dev/null)" ]; then
            git config user.name "trading-bot"
            git config user.email "trading-bot@users.noreply.github.com"
            git add $(ls -d $FILES 2>/dev/null)
            git commit -m "Résultats du $(date -u +%Y-%m-%d)"
            git push
          fi

  page:
    # Publie la page web (dossier docs/) sur GitHub Pages.
    # Réglage requis une fois : Settings → Pages → Source : « GitHub Actions ».
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # dernière version, résultats du jour inclus
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
