name: Robot de trading

on:
  schedule:
    # Chaque jour de semaine, heures UTC (Montréal = UTC-5 en hiver, UTC-4 en été).
    # GitHub ne garantit pas les horaires : il peut retarder ou sauter une exécution.
    # Les créneaux suivants servent de secours ; le robot ne joue qu'une fois par jour
    # (les exécutions suivantes s'arrêtent sur « Déjà exécuté aujourd'hui »).
    - cron: "35 15 * * 1-5"   # 10 h 35 (hiver)
    - cron: "17 17 * * 1-5"   # 12 h 17 (secours)
    - cron: "43 18 * * 1-5"   # 13 h 43 (secours)
    - cron: "11 20 * * 1-5"   # 15 h 11 (dernier secours, avant la fermeture de 16 h)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyse seulement (rien n'est acheté, vendu ni enregistré)"
        type: boolean
        default: false

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # pour enregistrer le journal, le portefeuille et la page dans le dépôt
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le robot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python bot.py --dry-run
          else
            python bot.py
          fi

      - name: Enregistrer les résultats
        if: always()
        run: |
          FILES="journal.csv portfolio.json README.md rapport docs"
          if [ -n "$(git status --porcelain $FILES 2>/dev/null)" ]; then
            git config user.name "trading-bot"
            git config user.email "trading-bot@users.noreply.github.com"
            git add $(ls -d $FILES 2>/dev/null)
            git commit -m "Résultats du $(date -u +%Y-%m-%d)"
            git push
          fi

  page:
    # Publie la page web (dossier docs/) sur GitHub Pages.
    # Réglage requis une fois : Settings → Pages → Source : « GitHub Actions ».
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # dernière version, résultats du jour inclus
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true      # GitHub Pages échoue parfois sans raison : on réessaie
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
