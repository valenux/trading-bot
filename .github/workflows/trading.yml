name: Robot de trading

on:
  schedule:
    # Chaque jour de semaine à 15 h 35 UTC
    # (= 10 h 35 à Montréal en hiver, 11 h 35 en été ; le marché ouvre à 9 h 30)
    - cron: "35 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyse seulement (rien n'est acheté, vendu ni enregistré)"
        type: boolean
        default: false

permissions:
  contents: write   # pour enregistrer journal.csv et portfolio.json dans le dépôt

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le robot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python bot.py --dry-run
          else
            python bot.py
          fi

      - name: Enregistrer le journal
        if: always()
        run: |
          if [ -n "$(git status --porcelain journal.csv portfolio.json 2>/dev/null)" ]; then
            git config user.name "trading-bot"
            git config user.email "trading-bot@users.noreply.github.com"
            git add $(ls journal.csv portfolio.json 2>/dev/null)
            git commit -m "Journal du $(date -u +%Y-%m-%d)"
            git push
          fi
