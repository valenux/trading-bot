name: Backtest des stratégies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backtest.py", "strategy.py", ".github/workflows/backtest.yml"]

concurrency:
  group: trading-bot   # n'entre jamais en conflit avec le robot du jour
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lancer le backtest
        run: python backtest.py >> "$GITHUB_STEP_SUMMARY"
      - name: Enregistrer les résultats
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add backtest
          git diff --cached --quiet || git commit -m "Résultats du backtest"
          git pull --rebase -q && git push
